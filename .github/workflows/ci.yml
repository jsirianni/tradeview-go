name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Go 1.27 / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: List development tasks
        run: make
      - name: Validate packages
        run: make ci
      - name: Check clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
