name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Install GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --version=4.4.1 --yes --no-progress
      - name: List development tasks
        run: make
      - name: Check and build
        run: make check build

  generation:
    name: Reproducible generation and race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: make ci
      - name: Check clean checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
