name: Update Go

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-go
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Find the latest stable Go release
        id: go
        run: |
          version=$(go run ./internal/updatego)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create or update the Go version PR
        id: pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: automation/update-go
          delete-branch: true
          add-paths: go.mod
          commit-message: 'build: update Go to ${{ steps.go.outputs.version }}'
          title: 'build: update Go to ${{ steps.go.outputs.version }}'
          body: |
            Update the Go directive in go.mod to the newest stable release from https://go.dev/dl/?mode=json.

            Includes new minor releases as well as patches. CI reads its Go version from go.mod.
            Review compatibility and all CI results before merging; this workflow does not auto-merge.
      # Dispatch explicitly so CI runs without an extra PAT or GitHub App token.
      - name: Run CI on the updated PR branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref automation/update-go
