version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    groups:
      opentelemetry:
        patterns: ['go.opentelemetry.io/*']
        update-types: [minor, patch]
      go-modules:
        patterns: ['*']
        exclude-patterns: ['go.opentelemetry.io/*']
        update-types: [minor, patch]
      opentelemetry-security:
        applies-to: security-updates
        patterns: ['go.opentelemetry.io/*']
      go-modules-security:
        applies-to: security-updates
        patterns: ['*']
        exclude-patterns: ['go.opentelemetry.io/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
